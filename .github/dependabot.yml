version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
    # GitHub Actions ecosystem only supports `default-days` in cooldown
    # (Actions don't follow strict semver — most release single major tags).
    cooldown:
      default-days: 2

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
      - "javascript"
    # Supply-chain soak: wait N days after a release before opening a PR, so
    # registry takedowns / CVEs / follow-up patches have time to surface.
    cooldown:
      default-days: 1
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 1
    ignore:
      # Puppeteer ships a bundled Chromium — major bumps need manual testing
      - dependency-name: puppeteer
        update-types: ["version-update:semver-major"]
