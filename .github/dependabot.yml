version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    ignore:
      # Puppeteer ships a bundled Chromium — major bumps need manual testing
      - dependency-name: puppeteer
        update-types: ["version-update:semver-major"]
